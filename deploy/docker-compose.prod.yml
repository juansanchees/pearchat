# Projeto compose "pearchat", com Caddy proprio nas portas 80/443 (o Zapfloo foi aposentado e fica parado). Uso:
#   docker compose -p pearchat -f deploy/docker-compose.prod.yml --env-file deploy/.env.production up -d --build
name: pearchat

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    mem_limit: 128m
    depends_on:
      - app
    networks: [pearchat]

  app:
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL}
        NEXT_PUBLIC_WA_MOCK: ${NEXT_PUBLIC_WA_MOCK:-false}
        NEXT_PUBLIC_META_APP_ID: ${NEXT_PUBLIC_META_APP_ID:-}
        NEXT_PUBLIC_META_CONFIG_ID: ${NEXT_PUBLIC_META_CONFIG_ID:-}
    image: pearchat-app:latest
    restart: unless-stopped
    init: true
    stop_grace_period: 40s
    env_file: .env.production
    ports:
      # somente loopback (diagnostico na VPS); o acesso publico e pelo Caddy
      - "127.0.0.1:${PEARCHAT_PORT:-8088}:3000"
    mem_limit: 1g
    environment:
      # Mídias das conversas (imagens, áudios, documentos): volume nomeado, precisa entrar no backup.
      MEDIA_DIR: /data/media
    volumes:
      - pearchat_media:/data/media
    depends_on:
      - evolution
    networks: [pearchat]

  evolution:
    image: evoapicloud/evolution-api:v2.3.7
    restart: unless-stopped
    mem_limit: 1g
    depends_on:
      - evolution-db
      - evolution-redis
    environment:
      SERVER_URL: http://evolution:8080
      AUTHENTICATION_API_KEY: ${EVOLUTION_API_KEY}
      DATABASE_ENABLED: "true"
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: postgresql://evolution:${EVOLUTION_DB_PASSWORD}@evolution-db:5432/evolution
      DATABASE_CONNECTION_CLIENT_NAME: pearchat
      # Persistência no banco da Evolution: sem isto os endpoints chat/find* (findChats, findMessages,
      # findContacts) voltam vazios e o PearChat não consegue importar as conversas anteriores.
      DATABASE_SAVE_DATA_INSTANCE: "true"
      DATABASE_SAVE_DATA_NEW_MESSAGE: "true"
      DATABASE_SAVE_MESSAGE_UPDATE: "true"
      DATABASE_SAVE_DATA_CONTACTS: "true"
      DATABASE_SAVE_DATA_CHATS: "true"
      DATABASE_SAVE_DATA_HISTORIC: "true"
      CACHE_REDIS_ENABLED: "true"
      CACHE_REDIS_URI: redis://evolution-redis:6379/6
      CACHE_REDIS_PREFIX_KEY: evolution
      CACHE_LOCAL_ENABLED: "false"
    volumes:
      - evolution_instances:/evolution/instances
    networks: [pearchat]

  evolution-db:
    image: postgres:16-alpine
    restart: unless-stopped
    mem_limit: 512m
    environment:
      POSTGRES_DB: evolution
      POSTGRES_USER: evolution
      POSTGRES_PASSWORD: ${EVOLUTION_DB_PASSWORD}
    volumes:
      - evolution_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U evolution -d evolution"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [pearchat]

  evolution-redis:
    image: redis:7-alpine
    restart: unless-stopped
    mem_limit: 256m
    volumes:
      - evolution_redis_data:/data
    networks: [pearchat]

networks:
  pearchat:
    name: pearchat_net

volumes:
  pearchat_media:
    name: pearchat_media
  caddy_data:
    name: pearchat_caddy_data
  caddy_config:
    name: pearchat_caddy_config
  evolution_instances:
    name: pearchat_evolution_instances
  evolution_db_data:
    name: pearchat_evolution_db_data
  evolution_redis_data:
    name: pearchat_evolution_redis_data
